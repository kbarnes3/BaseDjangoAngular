<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Change Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (successMessage) {
        <div class="auth-alert auth-alert-success" role="status">{{ successMessage }}</div>
      }
      @if (errorMessage) {
        <div class="auth-alert auth-alert-error" role="alert">{{ errorMessage }}</div>
      }
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Current Password</mat-label>
          <input matInput type="password" [(ngModel)]="currentPassword" name="currentPassword" required>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput type="password" [(ngModel)]="newPassword" name="newPassword" required>
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading">
          {{ loading ? 'Changing...' : 'Change Password' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
