<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Reset Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (successMessage()) {
        <div class="auth-alert auth-alert-success" role="status">{{ successMessage() }}</div>
        <div class="auth-center">
          <a mat-flat-button color="primary" routerLink="/login">Back to Login</a>
        </div>
      } @else {
        @if (errorMessage()) {
          <div class="auth-alert auth-alert-error" role="alert">{{ errorMessage() }}</div>
        }
        <form (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="email" name="email" required>
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading()">
            {{ loading() ? 'Sending...' : 'Send Reset Link' }}
          </button>
        </form>
        <div class="auth-links">
          <a routerLink="/login">Back to Login</a>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
