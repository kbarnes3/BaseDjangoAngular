<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h2>Set New Password</h2>
    @if (keyChecking) {
      <div class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Validating...</span>
        </div>
      </div>
    }
    @if (successMessage) {
      <div class="alert alert-success">{{ successMessage }}</div>
      <div class="text-center mt-3">
        <a routerLink="/login" class="btn btn-primary">Go to Login</a>
      </div>
    }
    @if (errorMessage && !keyValid) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
      <div class="text-center mt-3">
        <a routerLink="/password-reset" class="btn btn-primary">Request New Reset Link</a>
      </div>
    }
    @if (keyValid && !successMessage) {
      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="password" class="form-label">New Password</label>
          <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
    }
  </div>
</div>
