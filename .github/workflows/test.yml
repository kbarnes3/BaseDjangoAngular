name: Test 🧪 BaseDjangoAngular

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'front/package-lock.json'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
    - name: Install Python dependencies
      run: |
        uv sync
    - name: Running pylint back
      run: |
        uv run pylint back
    - name: Running pylint fabric_utils
      run: |
        uv run pylint fabric_utils
    - name: Running pylint fabfile.py
      run: |
        uv run pylint fabfile.py
    - name: Run pytest back
      run: |
        uv run pytest back
    - name: Running fab -l
      run: |
        uv run fab -l
    - name: Install Node dependencies
      run: |
        cd front
        npm install --location=global npm@11
        npm install --location=global @angular/cli
        npm ci
    - name: Run ng lint
      run: |
        cd front
        npm run-script lint
    - name: Run ng test
      run: |
        cd front
        npm run-script test-headless
    - name: Run ng build
      run: |
        cd front
        npm run-script build
