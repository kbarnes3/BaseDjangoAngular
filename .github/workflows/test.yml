name: Test 🧪 BaseDjangoAngular

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.x"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'front/package-lock.json'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - name: Install Python dependencies
      run: |
        uv sync
    - name: Running pylint back
      run: |
        uv run pylint back
    - name: Running pylint fabric_utils
      run: |
        uv run pylint fabric_utils
    - name: Running pylint fabfile.py
      run: |
        uv run pylint fabfile.py
    - name: Run pytest back
      run: |
        uv run pytest back
    - name: Running fab -l
      run: |
        uv run fab -l
    - name: Install Node dependencies
      run: |
        cd front
        npm ci
    - name: Run ng lint
      run: |
        cd front
        npm run-script lint
    - name: Run ng test
      run: |
        cd front
        npm run-script test-headless
    - name: Run ng build
      run: |
        cd front
        npm run-script build
