name: Test 🧪 BaseDjangoAngular

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.x"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'front/package-lock.json'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
    - name: Install Python dependencies
      run: |
        uv sync
    - name: Running pylint back
      run: |
        uv run pylint back
    - name: Running pylint fabric_utils
      run: |
        uv run pylint fabric_utils
    - name: Running pylint fabfile.py
      run: |
        uv run pylint fabfile.py
    - name: Run pytest back
      run: |
        uv run pytest back
    - name: Running fab -l
      run: |
        uv run fab -l
    - name: Install Node dependencies
      run: |
        cd front
        npm ci
    - name: Run ng lint
      run: |
        cd front
        npm run-script lint
    - name: Run ng test
      run: |
        cd front
        npm run-script test-headless
    - name: Run ng build
      run: |
        cd front
        npm run-script build
