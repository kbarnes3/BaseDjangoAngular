name: Test 🧪 BaseDjangoAngular

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.x"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'front/package-lock.json'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
    - name: Install Python dependencies
      run: |
        uv sync
    - name: Running pylint back
      run: |
        uv run pylint back
    - name: Running pylint fabric_utils
      run: |
        uv run pylint fabric_utils
    - name: Running pylint fabfile.py
      run: |
        uv run pylint fabfile.py
    - name: Run pytest back
      run: |
        uv run pytest back
    - name: Running fab -l
      run: |
        uv run fab -l
    - name: Install Node dependencies
      run: |
        cd front
        npm ci
    - name: Run ng lint
      run: |
        cd front
        npm run-script lint
    - name: Run ng test
      run: |
        cd front
        npm run-script test-headless
    - name: Run ng build
      run: |
        cd front
        npm run-script build
